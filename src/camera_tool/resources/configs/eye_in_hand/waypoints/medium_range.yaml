# Medium-Range Eye-in-Hand Flange Waypoints (optical distance ~410-530 mm)
# Poses are in FLANGE coordinates [x_mm, y_mm, z_mm, roll_deg, pitch_deg, yaw_deg] (extrinsic 'xyz').

profile: "arm_6dof"
dof: 6
device_type: 6

workspace:
  flange_min_m: [0.22, -0.28, 0.41]
  flange_max_m: [0.58, 0.28, 0.58]
  target_center_m: [0.41, 0.00, 0.00]

motion:
  joint_margin_deg: 8.0
  joint_step_deg: 8.0
  path_sample_deg: 1.0
  translation_step_m: 0.015
  rotation_step_deg: 5.0
  speed_deg_s: 10.0
  acceleration_deg_s2: 25.0
  settle_s: 0.5
  settle_position_mm: 0.3
  settle_rotation_deg: 0.1
  move_timeout_s: 20.0

park_flange_pose: [330.0, 0.0, 480.0, 180.0, 0.0, 0.0]

eye_in_hand_waypoints:
  - id: 1
    name: "center_mid_0"
    flange_pose: [350.0, 0.0, 480.0, 180.0, 0.0, 0.0]
    role: "train"
  - id: 2
    name: "rear_tilt_fwd"
    flange_pose: [276.8, 0.0, 480.0, 180.0, -9.0, 0.0]
    role: "train"
