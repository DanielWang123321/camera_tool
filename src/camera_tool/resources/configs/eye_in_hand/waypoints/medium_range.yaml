    flange_pose: [350.3, -53.2, 480.0, -171.5, 0.0, -10.0]
    role: "train"
  - id: 5
    name: "left_tilt_right"
    flange_pose: [350.3, 53.2, 480.0, 171.5, 0.0, 10.0]
    role: "check"
  - id: 6
